{% extends "base.html" %}

{% block title %}Sign in | Smart Campus{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block auth_content %}
<section class="auth-card" aria-labelledby="auth-title">
    <p class="eyebrow">STUDENT & ADMIN PORTAL</p>
    <h1 id="auth-title">Welcome back</h1>
    <p class="auth-intro">Sign in to access your campus services.</p>

    <form method="POST" action="{{ url_for('login') }}" class="form-stack">
        <div class="form-field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="button button-primary button-full">Sign in</button>
    </form>

    <p class="auth-switch">New to Smart Campus? <a href="{{ url_for('register') }}">Create a student account</a></p>
</section>
{% endblock %}
