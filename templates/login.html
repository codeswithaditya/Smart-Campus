<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Campus</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">SC</div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your Smart Campus account
            </p>


            <form method="POST"
                  action="{{ url_for('login') }}">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="bottom-text">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>

</html>
